[project]
name = "ddgo-search"
version = "1.3.0"
description = "A resilient, token-efficient CLI wrapper around the DuckDuckGo Search (ddgs) Python library."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "twn39" }
]
license = { file = "LICENSE" }
keywords = [
    "duckduckgo",
    "ddg",
    "search-api",
    "cli",
    "web-scraping",
    "llm-agent",
    "token-efficient"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.14.4",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.26.6",
]

[project.urls]
Homepage = "https://github.com/twn39/ddgo-search"
Repository = "https://github.com/twn39/ddgo-search"
Issues = "https://github.com/twn39/ddgo-search/issues"

[project.scripts]
ddgo-search = "ddgo_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

